  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(140.644531 439.145)">operations / wall_s: холодное начало, статистика, перестройки и завершение включены.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(137.000781 451.318047)">Столбец — медиана; точки — все повторы; усы — min–max, не доверительный интервал.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(81.789844 463.32)">Шкалы панелей различаются, все начинаются с нуля. W — ширина одного горячего окна, L — длина запроса.</text>
