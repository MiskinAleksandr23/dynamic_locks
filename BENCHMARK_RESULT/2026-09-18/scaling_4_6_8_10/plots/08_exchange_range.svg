  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle" x="414" y="491.4" transform="rotate(-0 414 491.4)">Перестройки при 4 / 6 / 8 / 10 потоках — balanced: 2 / 2 / 3 / 2; DP: 2 / 2 / 3 / 2</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(143.39918 518.97775)">64 блокировки; выборка 1/64; проверка перестройки раз в 30 с. Холодный старт и перестройки включены.</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(152.861328 530.379605)">Один повтор на точку. 8 потоков — предыдущая серия; 4, 6, 10 — новая. Линии соединяют измерения.</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(169.937578 541.944)">Объём работы фиксирован; длительность и доля времени до первой перестройки различаются.</text>
  </g>
